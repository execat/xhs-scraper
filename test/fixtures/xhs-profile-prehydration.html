<!--
  NOT hand-invented: this mirrors a REAL anonymous capture of
  https://www.xiaohongshu.com/user/profile/6308604100000000120013e8
  (curl, 2026-10-10, 249 KB, no login wall). Two facts from that capture drove
  this fixture, and both are load-bearing:

    1. The card links carry NO note id. XHS serves
         /user/profile/<uid>/?xsec_token=<token>&xsec_source=pc_user
       and a bare "/explore/" for the cover; navigation is done in JS. This is
       why the scraper finds cards but zero note links on a page like this.

    2. __INITIAL_STATE__ ships noteCard.noteId as an EMPTY STRING for every card
       while time / xsecToken / displayTitle are fully populated. The ids only
       appear once the client has hydrated.

  So this fixture pins the "page has not finished loading" behaviour: it must
  warn clearly, not return a silent empty CSV.

  The `time` and `displayTitle` below are the real values, and they are exactly
  PLAN.md's XHS row 1 (time 1790758357000 == 2026-09-30 16:52:37+08, which is
  also what note id 6abccdd5… decodes to).
-->
